version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: simplcommerce
      POSTGRES_USER: simplcommerce
      POSTGRES_PASSWORD: simplcommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplcommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: simplcommerce
      RABBITMQ_DEFAULT_PASS: simplcommerce
    ports:
      - "5672:5672"
      - "15672:15672"

  identity-service:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    environment:
      SERVICE_NAME: identity
      PORT: ":8081"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: simplcommerce
      DB_PASSWORD: simplcommerce
      DB_NAME: simplcommerce
      JWT_SECRET: simplcommerce-jwt-secret
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    environment:
      SERVICE_NAME: catalog
      PORT: ":8082"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: simplcommerce
      DB_PASSWORD: simplcommerce
      DB_NAME: simplcommerce
      JWT_SECRET: simplcommerce-jwt-secret
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  cart-service:
    build:
      context: .
      dockerfile: services/cart/Dockerfile
    environment:
      SERVICE_NAME: cart
      PORT: ":8083"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: simplcommerce
      DB_PASSWORD: simplcommerce
      DB_NAME: simplcommerce
      JWT_SECRET: simplcommerce-jwt-secret
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  orders-service:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    environment:
      SERVICE_NAME: orders
      PORT: ":8084"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: simplcommerce
      DB_PASSWORD: simplcommerce
      DB_NAME: simplcommerce
      JWT_SECRET: simplcommerce-jwt-secret
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    environment:
      SERVICE_NAME: payment
      PORT: ":8085"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: simplcommerce
      DB_PASSWORD: simplcommerce
      DB_NAME: simplcommerce
      JWT_SECRET: simplcommerce-jwt-secret
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy

  shipping-service:
    build:
      context: .
      dockerfile: services/shipping/Dockerfile
    environment:
      SERVICE_NAME: shipping
      PORT: ":8086"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: simplcommerce
      DB_PASSWORD: simplcommerce
      DB_NAME: simplcommerce
      JWT_SECRET: simplcommerce-jwt-secret
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    environment:
      SERVICE_NAME: inventory
      PORT: ":8087"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: simplcommerce
      DB_PASSWORD: simplcommerce
      DB_NAME: simplcommerce
      JWT_SECRET: simplcommerce-jwt-secret
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy

  pricing-service:
    build:
      context: .
      dockerfile: services/pricing/Dockerfile
    environment:
      SERVICE_NAME: pricing
      PORT: ":8088"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: simplcommerce
      DB_PASSWORD: simplcommerce
      DB_NAME: simplcommerce
      JWT_SECRET: simplcommerce-jwt-secret
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy

  reviews-service:
    build:
      context: .
      dockerfile: services/reviews/Dockerfile
    environment:
      SERVICE_NAME: reviews
      PORT: ":8089"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: simplcommerce
      DB_PASSWORD: simplcommerce
      DB_NAME: simplcommerce
      JWT_SECRET: simplcommerce-jwt-secret
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      SERVICE_NAME: api-gateway
      PORT: ":8080"
      IDENTITY_SERVICE_URL: http://identity-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      CART_SERVICE_URL: http://cart-service:8083
      ORDERS_SERVICE_URL: http://orders-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      SHIPPING_SERVICE_URL: http://shipping-service:8086
      INVENTORY_SERVICE_URL: http://inventory-service:8087
      PRICING_SERVICE_URL: http://pricing-service:8088
      REVIEWS_SERVICE_URL: http://reviews-service:8089
    ports:
      - "80:8080"
    depends_on:
      - identity-service
      - catalog-service
      - cart-service
      - orders-service
      - payment-service
      - shipping-service
      - inventory-service
      - pricing-service
      - reviews-service

volumes:
  postgres_data:
